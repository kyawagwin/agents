# ==============================================================================
# POD A: Product & Design Pod Tasks
# ==============================================================================

backlog_refinement_task:
  description: >
    Perform an in-depth Agile Backlog Refinement based on the project requirements:
    "{project_requirements}"
    
    Execute the following steps:
    1. Define a concise, measurable Sprint Goal.
    2. Formulate a rigorous Definition of Done (DoD) covering backend quality, frontend a11y, and security.
    3. Decompose the requirements into INVEST-compliant User Stories.
    4. For EACH story, write unambiguous Gherkin Acceptance Criteria (Given-When-Then).
    5. Estimate Fibonacci story points (1, 2, 3, 5, 8, 13) and prioritize via MoSCoW.
    
    Structure your response strictly according to the SprintBacklog Pydantic schema.
  expected_output: >
    A fully populated SprintBacklog object containing the sprint goal, definition of done, prioritized user stories 
    with Gherkin acceptance criteria, Fibonacci story points, and total committed velocity.
  agent: product_owner

ui_ux_design_task:
  description: >
    Consume the user stories and Gherkin acceptance criteria from backlog_refinement_task.
    Design an enterprise-grade, accessible Design System and responsive layout architecture.
    
    Execute the following steps:
    1. Define the semantic color palette, typography hierarchy, and spacing/radii using modern Tailwind CSS tokens.
    2. Design atomic UI components (Buttons, Cards, Form Inputs, Status Badges, Modals) with detailed visual states 
       (default, hover, active, loading, disabled, error) and Tailwind utility classes.
    3. Specify page wireframe layouts and responsive breakpoints for mobile, tablet, and desktop views.
    4. Provide a WCAG 2.1 AA accessibility compliance checklist (color contrast, ARIA labels, keyboard focus rings).
    
    Structure your response strictly according to the DesignSystemSpec Pydantic schema.
  expected_output: >
    A fully populated DesignSystemSpec object containing design tokens, atomic UI components, responsive wireframes, 
    and WCAG 2.1 AA accessibility guidelines.
  agent: ui_ux_designer

# ==============================================================================
# POD B: Full-Stack Engineering Pod Tasks
# ==============================================================================

architecture_contract_task:
  description: >
    Review the SprintBacklog from the Product Owner and the DesignSystemSpec from the UI/UX Designer.
    Architect a scalable, secure technical blueprint and formal API contract.
    
    Execute the following steps:
    1. Define the system architecture pattern (Clean Architecture / Layered Domain Model) and component boundaries.
    2. Specify the modern tech stack (Python 3.12+, FastAPI, SQLAlchemy, PostgreSQL, Redis, Next.js 14, Tailwind CSS).
    3. Design normalized database schemas with table names, explicit column types, primary/foreign keys, and indexes.
    4. Design RESTful API endpoint contracts including HTTP methods, paths, request payload schemas, and HTTP 200/error responses.
    5. Define Non-Functional Requirements (NFRs) across Security, Scalability, Observability, and Performance.
    6. Establish the canonical project directory structure separating backend and frontend services.
    
    Structure your response strictly according to the ArchitectureSpec Pydantic schema.
  expected_output: >
    A fully populated ArchitectureSpec object detailing component boundaries, database schemas, API route contracts, 
    NFRs, and repository layout.
  agent: system_architect

backend_implementation_task:
  description: >
    Implement the complete, production-grade backend source code based on the ArchitectureSpec and SprintBacklog.
    
    Execute the following steps:
    1. Implement database entities and ORM/SQLModel schemas with indices and relationships.
    2. Implement RESTful API route controllers using FastAPI matching the exact OpenAPI contracts designed by the Architect.
    3. Implement the core business logic and service layer with robust validation and custom domain exceptions.
    4. Implement application configuration, logging, health check endpoints, and HMAC / authentication security.
    5. Adhere strictly to SOLID principles, type annotations, and defensive programming.
    6. NO placeholders or stubbed ellipses (...). Provide complete, working code.
    
    Structure your response strictly according to the BackendImplementation Pydantic schema.
  expected_output: >
    A fully populated BackendImplementation object containing all backend source code files, database models, 
    API routers, service layer, and local run instructions.
  agent: backend_developer

frontend_implementation_task:
  description: >
    Implement the complete, production-grade frontend client application based on the DesignSystemSpec, 
    ArchitectureSpec, and BackendImplementation.
    
    Execute the following steps:
    1. Implement reusable atomic UI components matching the UI/UX Designer's specifications and Tailwind classes.
    2. Implement responsive page views and layout templates matching the wireframe specifications.
    3. Implement typed API client fetchers and client state management interacting directly with the backend endpoints.
    4. Implement responsive error handling, loading skeletons, and interactive state transitions.
    5. Enforce WCAG 2.1 AA accessibility (ARIA attributes, semantic HTML elements, keyboard focus).
    6. NO placeholders or stubbed ellipses (...). Provide complete, working code.
    
    Structure your response strictly according to the FrontendImplementation Pydantic schema.
  expected_output: >
    A fully populated FrontendImplementation object containing all frontend source code files, components, 
    pages, API client hooks, theme configuration, and local run instructions.
  agent: frontend_developer

# ==============================================================================
# POD C: Quality & Platform Delivery Pod Tasks
# ==============================================================================

qa_verification_task:
  description: >
    Execute an exhaustive Quality Assurance, Component Verification, and Security audit across both 
    backend and frontend implementations, validating every single Acceptance Criterion defined in the SprintBacklog.
    
    Execute the following steps:
    1. Map each user story and Gherkin scenario to automated pytest test suites for backend APIs.
    2. Write component test verification for critical frontend UI interactions.
    3. Audit against the OWASP Top 10 (SQL injection, broken access control, XSS, SSRF).
    4. Audit frontend components for WCAG 2.1 AA compliance (contrast, keyboard focus, screen reader markup).
    5. Document any defects discovered with severity (CRITICAL, HIGH, MEDIUM, LOW), reproduction steps, and target tier.
    6. Set sign_off_status to 'APPROVED' ONLY if failed_tests == 0 and zero CRITICAL/HIGH defects exist.
    
    Structure your response strictly according to the QAReport Pydantic schema.
  expected_output: >
    A fully populated QAReport object containing total test counts, coverage percentage, automated test suites, 
    OWASP and a11y audit, defect tracking log, and formal sign-off recommendation.
  agent: qa_engineer

deployment_and_sprint_review_task:
  description: >
    Synthesize the full-stack architecture, backend implementation, frontend implementation, and QA report 
    to build production deployment artifacts and conduct the Sprint Review.
    
    Execute the following steps:
    1. Create a production multi-stage Dockerfile for the Python backend.
    2. Create a production multi-stage Dockerfile for the Next.js/Node frontend.
    3. Generate a root docker-compose.yml orchestrating PostgreSQL, Redis, Backend API, and Frontend client.
    4. Generate a comprehensive GitHub Actions CI/CD workflow (.github/workflows/ci.yml) testing both tiers.
    5. Generate a unified .env.example with documented configuration.
    6. Calculate the Release Readiness Score (0-100) and compile the executive Sprint Review and Retrospective.
    7. Make the final binary Release Sign-Off determination.
    
    Structure your response strictly according to the SprintReleasePackage Pydantic schema.
  expected_output: >
    A fully populated SprintReleasePackage object containing backend/frontend Dockerfiles, docker-compose.yml, 
    GitHub Actions pipeline, environment template, release score, and sprint review summary.
  agent: devops_release_lead
