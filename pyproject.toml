[project]
name = "agile-dev-crew"
version = "0.1.0"
description = "Production-grade multi-agent software development team operationalizing Agile Scrum via CrewAI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Principal AI Systems Architect & Agile Coach", email = "architect@agilecrew.ai" }
]
dependencies = [
    "crewai[tools]>=0.80.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.0.0",
]

[project.scripts]
agile-dev-crew = "agile_dev_crew.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agile_dev_crew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
